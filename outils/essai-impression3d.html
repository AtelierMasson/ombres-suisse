<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impression 3D : essai de la fenêtre</title>
</head>
<body>
<p style="margin: 16px; font: 13px system-ui">
  Essai de la fenêtre « Impression 3D » sur le hameau de démonstration (outils/, pas dans le site) :
  <button id="ouvrir">Ouvrir</button> · ?lang=de|it|en · ?theme=nuit
</p>
<script type="module">
// Ouvre la vraie fenêtre (src/impression3dFenetre.js) avec la grille du hameau (src/demo.js) et les toits du relevé,
// sans charger de lieu : vérification à l'œil, ou par Playwright (window.__essai : nom et taille du dernier fichier).
import "bootstrap/dist/css/bootstrap.min.css";
import "../src/style.css";
import { hameau } from "../src/demo.js";
import { contoursBatiments } from "../src/contours.js";
import { toitsReleve } from "../src/impression3dToits.js";
import { ouvrirImpression3D } from "../src/impression3dFenetre.js";

const q = new URLSearchParams(location.search);
if (q.get("theme")) document.body.dataset.theme = q.get("theme");
const { G } = hameau();
window.__essai = { fichiers: [] };
const ouvrir = () => ouvrirImpression3D({
  G, jeu: "releve",
  toits: async type => type === "aucun" ? [] : type === "releve" ? [toitsReleve(G, contoursBatiments(G))] : null,
  nom: (contenu, ext) => `hameau_${contenu}.${ext}`,
  telecharger: async (blob, nom) => { window.__essai.fichiers.push({ nom, taille: blob.size, octets: new Uint8Array(await blob.arrayBuffer()) }); },
});
document.getElementById("ouvrir").onclick = ouvrir;
ouvrir();
</script>
</body>
</html>
