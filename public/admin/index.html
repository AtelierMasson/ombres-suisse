<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Topograph — administration</title>
<style>
  :root { --fond: #f6f3ee; --carte: #fffdf9; --bord: #e4ddd2; --texte: #2a2723; --doux: #7a736a; --accent: #c8741a; --vert: #3f7d4e; --rayon: 10px; }
  @media (prefers-color-scheme: dark) { :root { --fond: #171a20; --carte: #1f232b; --bord: #323845; --texte: #e8e6e1; --doux: #9aa0ab; --accent: #e6a04a; --vert: #7fbf8e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--bord); }
  header h1 { font-size: 18px; margin: 0; } header a { color: var(--doux); font-size: 13px; margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 12px 14px; }
  .tuile .lib { font-size: 12px; color: var(--doux); } .tuile .val { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  section { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 16px; }
  section h2 { font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--bord); } th { color: var(--doux); font-weight: 500; border-top: 0; }
  .pastille { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--bord); }
  .pastille.pro { border-color: var(--vert); color: var(--vert); }
  button, input { font: inherit; } input { padding: 5px 8px; border: 1px solid var(--bord); border-radius: 6px; background: var(--fond); color: var(--texte); }
  button { padding: 4px 10px; border: 1px solid var(--bord); border-radius: 6px; background: transparent; color: var(--texte); cursor: pointer; } button:hover { border-color: var(--accent); }
  .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .graphe svg { width: 100%; height: 140px; } .graphe text { fill: var(--doux); font-size: 10px; }
  .message { padding: 40px 16px; text-align: center; color: var(--doux); } .message a { color: var(--accent); }
  .defile { max-height: 420px; overflow: auto; }
</style>
</head>
<body>
<header><h1>Topograph · administration</h1><span id="maj" style="color:var(--doux);font-size:12px"></span><a href="/">← retour au site</a></header>
<main id="contenu"><p class="message">Chargement…</p></main>
<script src="admin.js"></script>
</body>
</html>
